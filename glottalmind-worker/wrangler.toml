# glottalmind-worker: talkingmind.cc's real Workers AI TTS service
# (@cf/myshell-ai/melotts, see worker.js header for the full history).
# Real, working worker.js was committed 2026-09-11 but never actually
# deployed - no wrangler.toml existed, so `wrangler deploy` had nothing
# to run against. Confirmed 2026-09-13: https://talkingmind.cc/api/health
# and https://glottalmind-worker.jmobleyworks.workers.dev/api/health both
# 404 (route/subdomain don't exist yet), and this session has no
# Cloudflare credentials (`wrangler whoami` unauthenticated, no
# MY_CLOUDFLARE_* env vars set) - so this file is prepared but NOT yet
# deployed. Next real step: from a session with real Cloudflare auth,
# `cd talkingmind.cc/glottalmind-worker && wrangler deploy`, then
# live-verify GET /api/health and POST /api/tts against the resulting
# *.workers.dev URL.
name = "glottalmind-worker"
main = "worker.js"
compatibility_date = "2026-08-13"

# Same account as every other jmobleyworks-pattern *-worker in this
# portfolio (vendyai-com-worker, the weyland-*-worker family, etc.) -
# matches the *.jmobleyworks.workers.dev subdomain already named for this
# worker in the 2026-09-12 finding this file resolves.
account_id = "f07be5f84583d0d100b05aeeae56870b"

# Keep the workers.dev subdomain on - this worker has no [[routes]] block
# yet (talkingmind.cc's zone routing is a separate, not-yet-scoped piece
# of work), so *.workers.dev is the only way to reach it at all post-deploy.
workers_dev = true

[observability]
enabled = true

# [ai] binding REMOVED 2026-09-13 (real cost decision - John: stop using
# Cloudflare Workers AI anywhere across the conglomerate). worker.js's
# POST /api/tts used to call env.AI.run("@cf/myshell-ai/melotts", ...) -
# it now returns an honest "not currently available" response instead.
# This worker was never actually deployed (confirmed 2026-09-13: no live
# route/subdomain resolves), so removing this binding is a source-level
# fix with zero live blast radius - but it also means talkingmind.cc's
# GlottalMind TTS role (ventures.json commit 543fa0b) currently has no
# working synthesis backend at all; a real non-Workers-AI TTS mechanism
# would need to be found before this venture's core feature is real.
